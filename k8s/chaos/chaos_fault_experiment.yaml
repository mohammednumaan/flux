apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: flux-backend-fault-experiment
  namespace: flux
spec:
  mode: fixed-percent
  value: "70"
  selector:
    namespaces:
      - flux
    labelSelectors:
      app: flux-backend
      experiment-group: normal 
  target: Request
  port: 8080
  path: /api
  abort: true
  duration: 5m
