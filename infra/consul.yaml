apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul-server
  namespace: flux
  labels:
    app: consul-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consul-server
  template:
    metadata:
      labels:
        app: consul-server
    spec:
      containers:
        - name: consul
          image: hashicorp/consul:2.0.3
          args:
            - agent
            - -server
            - -ui
            - -client=0.0.0.0
            - -data-dir=/consul/data
            - -node=consul-server
            - -bootstrap-expect=1
          ports:
            - containerPort: 8500
              name: http
            - containerPort: 8600
              protocol: TCP
            - containerPort: 8600
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /v1/status/leader
              port: 8500
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/status/leader
              port: 8500
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: consul-server
  namespace: flux
spec:
  selector:
    app: consul-server
  ports:
    - name: http
      port: 8500
      targetPort: 8500
    - name: dns-tcp
      port: 8600
      targetPort: 8600
      protocol: TCP
    - name: dns-udp
      port: 8600
      targetPort: 8600
      protocol: UDP
